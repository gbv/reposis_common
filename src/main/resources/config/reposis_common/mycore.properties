##############################################################################
# Batch editor: mods:relatedItem links                                       #
##############################################################################
# Adds and removes links between publications, so that circular links can be
# resolved on the command line:
#
#   edit openagrar_mods_00115481 at publication remove otherVersionLink openagrar_mods_00115482
#   edit openagrar_mods_00115481 at publication add otherVersionLink openagrar_mods_00115482
#
# The base level 'publication' is defined by mycore-mods and selects mods:mods.
# 'relatedItemLink' matches every relationship type and is meant for removing.
# There is deliberately no field for relatedItem[@type='host'], because that link
# is mirrored in structure/parents and must not be edited on its own.

MCR.BatchEditor.relatedItemLink.Path2Remove=mods:relatedItem[@xlink:href="{0}"]

MCR.BatchEditor.otherVersionLink.Path2Remove=mods:relatedItem[@type="otherVersion"][@xlink:href="{0}"]
MCR.BatchEditor.otherVersionLink.Path2Add=mods:relatedItem[@type="otherVersion"][@xlink:href="{0}"][@xlink:type="simple"]

MCR.BatchEditor.otherFormatLink.Path2Remove=mods:relatedItem[@type="otherFormat"][@xlink:href="{0}"]
MCR.BatchEditor.otherFormatLink.Path2Add=mods:relatedItem[@type="otherFormat"][@xlink:href="{0}"][@xlink:type="simple"]

MCR.BatchEditor.referencesLink.Path2Remove=mods:relatedItem[@type="references"][@xlink:href="{0}"]
MCR.BatchEditor.referencesLink.Path2Add=mods:relatedItem[@type="references"][@xlink:href="{0}"][@xlink:type="simple"]

MCR.BatchEditor.precedingLink.Path2Remove=mods:relatedItem[@type="preceding"][@xlink:href="{0}"]
MCR.BatchEditor.precedingLink.Path2Add=mods:relatedItem[@type="preceding"][@xlink:href="{0}"][@xlink:type="simple"]

MCR.BatchEditor.seriesLink.Path2Remove=mods:relatedItem[@type="series"][@xlink:href="{0}"]
MCR.BatchEditor.seriesLink.Path2Add=mods:relatedItem[@type="series"][@xlink:href="{0}"][@xlink:type="simple"]

